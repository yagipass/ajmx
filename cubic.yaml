# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
version: 1

reviews:
  external_contributors_require_manual_review: true
  ignore:
    files:
      - install.sh
      - nix/deps.json
      - flake.lock
      - docs/pnpm-lock.yaml
      - .github/workflows/actions.lock
      - gradlew
      - gradlew.bat
      - gradle/wrapper/**
    head_branches:
      - "dependabot/**"
      - build/update-flake-lock
    pr_titles:
      - "Release for v*"
  custom_rules:
    - name: Contributing guide
      file_paths:
        - CONTRIBUTING.md

pr_descriptions:
  generate: false
  cubic_review_link: false
