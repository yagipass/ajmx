[versions]
errorprone = "2.50.0"
junit = "6.1.3"

[libraries]
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-tidy = "io.github.yagipass:errorprone-tidy:0.1.0"
graalvm-nativeimage = "org.graalvm.sdk:nativeimage:25.4.4.1.1"
jspecify = "org.jspecify:jspecify:1.0.1"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
nullaway = "com.uber.nullaway:nullaway:0.14.2"

[plugins]
errorprone = "net.ltgt.errorprone:5.1.1"
graalvm-native = "org.graalvm.buildtools.native:1.1.14"
spotless = "com.diffplug.spotless:8.10.3"
