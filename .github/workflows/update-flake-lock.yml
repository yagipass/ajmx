name: update-flake-lock

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          nix flake update --commit-lock-file --commit-lock-file-summary 'build(nix): update flake.lock inputs'
      - id: pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: build/update-flake-lock
          delete-branch: true
          title: "build(nix): update flake.lock inputs"
          labels: dependencies
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run build.yml --ref "$BRANCH"
