name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: ajmx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check -L

  native:
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: graalvm/setup-graalvm@v1.6.7
        with:
          version: "25.3"
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
      - name: Build and test the native executable
        run: ./gradlew -Pnative check
      - name: Check the memory and time of the native executable
        run: |
          if [ ! -x /usr/bin/time ]; then
            sudo apt-get update && sudo apt-get install -y time
          fi
          ./gradlew -Pnative :it:perfTest
      - name: Check that only system libraries are linked
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L modules/cli/build/native/nativeCompile/ajmx
            ! otool -L modules/cli/build/native/nativeCompile/ajmx | tail -n +2 | grep -vE '^[[:space:]]+/(usr/lib|System/Library)/'
          else
            ldd modules/cli/build/native/nativeCompile/ajmx
            ! ldd modules/cli/build/native/nativeCompile/ajmx | grep -vE 'linux-vdso|ld-linux|lib(c|z|m|dl|pthread|rt)\.so'
          fi
      - name: Package
        run: |
          cp modules/cli/build/native/nativeCompile/ajmx "ajmx-${{ matrix.target }}"
          shasum -a 256 "ajmx-${{ matrix.target }}" > "ajmx-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ajmx-${{ matrix.target }}
          path: |
            ajmx-${{ matrix.target }}
            ajmx-${{ matrix.target }}.sha256
          if-no-files-found: error

  jdk-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: |
            8
            11
            17
            21
      - uses: graalvm/setup-graalvm@v1.6.7
        with:
          version: "25.3"
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
      - name: Unit and integration tests (JVM mode)
        run: ./gradlew check
      - name: Build the native executable
        run: ./gradlew :cli:nativeCompile
      - name: Integration tests of the native executable per target JDK
        run: |
          for java in "$JAVA_HOME_8_X64" "$JAVA_HOME_11_X64" "$JAVA_HOME_17_X64" "$JAVA_HOME_21_X64" "$JAVA_HOME"; do
            echo "::group::target $("$java/bin/java" -version 2>&1 | head -n 1)"
            ./gradlew -Pnative :it:test -Pajmx.test.java="$java/bin/java"
            echo "::endgroup::"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: ajmx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop .#docs --command sh -c 'cd docs && pnpm install --frozen-lockfile && pnpm run build && pnpm exec wrangler deploy --dry-run'

  tagpr:
    if: github.event_name == 'push'
    needs: [checks, native, jdk-matrix, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@v1.21.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    if: needs.tagpr.outputs.tag != ''
    needs: tagpr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: ajmx-*
          merge-multiple: true
          path: dist
      - uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*
            install.sh
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh release create "$TAG" dist/* install.sh --repo "$GITHUB_REPOSITORY" --generate-notes

  homebrew:
    needs: [tagpr, release]
    permissions:
      contents: read
    uses: yagipass/homebrew-tap/.github/workflows/bump.yml@main
    with:
      formula: ajmx
      tag: ${{ needs.tagpr.outputs.tag }}
    secrets:
      tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  docs-deploy:
    if: needs.tagpr.outputs.tag != ''
    needs: tagpr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: ajmx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop .#docs --command sh -c 'cd docs && pnpm install --frozen-lockfile && pnpm run build'
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop .#docs --command sh -c 'cd docs && pnpm exec wrangler deploy'
