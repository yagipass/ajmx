name: gradle-deps

on:
  pull_request:
    paths:
      - gradle/libs.versions.toml
      - "**.gradle.kts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
      - name: Let bubblewrap create user namespaces for the update script
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          update_script=$(nix build --no-link --print-out-paths .#ajmx.mitmCache.updateScript)
          "$update_script"
      - id: diff
        run: git diff --quiet || echo 'changed=true' >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deps-json
          path: nix/deps.json
          if-no-files-found: error

  push:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: deps-json
          path: ${{ runner.temp }}/deps-json
      - run: |
          if ! jq -e 'type == "object"' "$RUNNER_TEMP/deps-json/deps.json" >/dev/null; then
            echo '::error::the update job did not upload a JSON object as deps.json'
            exit 1
          fi
          cp "$RUNNER_TEMP/deps-json/deps.json" nix/deps.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'build(nix): update ajmx deps.json'
      - env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
