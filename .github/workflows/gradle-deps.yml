name: gradle-deps

on:
  pull_request:
    paths:
      - gradle/libs.versions.toml
      - "**.gradle.kts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
      - name: Let bubblewrap create user namespaces for the update script
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          update_script=$(nix build --no-link --print-out-paths .#ajmx.mitmCache.updateScript)
          "$update_script"
      - env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'build(nix): update ajmx deps.json'
          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
